name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Em PR, um push novo cancela a execução anterior da mesma branch. Fora de PR
# (push na main, execução manual) cada execução tem grupo próprio e nunca é
# cancelada, para todo commit da main ter análise e gate.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, build e testes
    runs-on: ubuntu-latest

    # Credenciais do Postgres efêmero do CI (não é segredo real); o DATABASE_URL
    # é montado num passo para não deixar a senha embutida em connection string.
    # O banco termina em _test porque o limparBanco dos e2e só roda nesse caso.
    env:
      PGUSER: academia
      PGPASSWORD: academia
      PGDATABASE: academia_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: academia
          POSTGRES_PASSWORD: academia
          POSTGRES_DB: academia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico completo para o SonarCloud (INF-05)
          fetch-depth: 0

      - name: Configurar DATABASE_URL
        run: echo "DATABASE_URL=postgresql://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}?schema=public" >> "$GITHUB_ENV"

      # Gerado a cada execução: com 64 caracteres, passa no mínimo de 32 da API,
      # e nenhum valor fica escrito no repositório.
      - name: Gerar JWT_SECRET de teste
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup do pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup do Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Testes unitários da API (cobertura)
        run: pnpm --filter api test:cov

      - name: Testes unitários do web (cobertura)
        run: pnpm --filter web test:cov

      - name: Aplicar migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Testes e2e da API
        run: pnpm --filter api test:e2e

      # O token fica só no passo do scan, longe do install, do build e dos testes.
      # Sem exceção: faltar o token derruba o job em qualquer evento, inclusive PR
      # de fork e do Dependabot (que não recebem os secrets do Actions). Assim o
      # check exigido pela proteção da main nunca fica verde sem o gate ter rodado.
      - name: Verificar SONAR_TOKEN
        env:
          TEM_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          if [ "$TEM_TOKEN" != "true" ]; then
            echo "::error::SONAR_TOKEN ausente: sem ele a análise e o quality gate do SonarCloud não rodam. PR de fork não recebe secrets: abra o PR a partir de uma branch do próprio repositório. Para o Dependabot, cadastre o SONAR_TOKEN também em Settings → Secrets → Dependabot."
            exit 1
          fi

      # Espera o quality gate (sonar.qualitygate.wait): gate reprovado falha este passo
      - name: Análise do SonarCloud
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publicar relatórios de cobertura
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cobertura
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: ignore
